[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anivault"
version = "2.0.0.dev0"
description = "AniVault V2 — 애니메이션 라이브러리 스캔·매칭·정리"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = []
keywords = ["anime", "library", "organizer", "tmdb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "anitopy",
    "python-dotenv>=1.0",
    "tmdbapis>=1.0",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-benchmark>=5",
    "pytest-cov",
    "mypy>=1.8",
    "black>=24",
    "ruff>=0.4",
]

[project.scripts]
anivault = "anivault.interfaces.gui.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"anivault.adapters.persistence.sqlite.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = '-v -m "not benchmark" --cov=src/anivault --cov-report=term-missing'
markers = [
    "benchmark: optional performance timing benchmarks (pytest -m benchmark tests/benchmarks)",
]

[tool.coverage.run]
source = ["src/anivault"]
omit = [
    "src/anivault/interfaces/gui/sample_panel.py",
    "src/anivault/__main__.py",
    "src/anivault/bootstrap/settings.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true

# -----------------------------------------------------------------------------
# 공통: Python 3.12, line-length 100, src 레이아웃
# -----------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
exclude = [
    "build/",
    "dist/",
    "\\.venv/",
    "venv/",
]

# GUI layer: Qt widgets and composition; relax to avoid 80+ annotation edits.
# domain/application/adapters remain strict.
[[tool.mypy.overrides]]
module = ["anivault.interfaces.gui.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["tmdbapis", "tmdbapis.*"]
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py312"]
include = "\\.pyi?$"
exclude = """
/(
    \\.git
    | \\.venv
    | venv
    | build
    | dist
)/
"""

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".git", ".venv", "venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line length → black 담당

[tool.ruff.lint.isort]
known-first-party = ["anivault"]
